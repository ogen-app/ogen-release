# The product lock file: the build of every service that ships together.
#
# A push to main deploys development; a release tag ogen-N deploys production
# with the same images. Service CI bumps `build` through a `bump` dispatch
# (.github/workflows/bump.yml); people change this file through PRs.
#
# Services are listed in deploy order.
services:
  pdf-service:
    image: ghcr.io/ogen-app/pdf-service
    build: 18
    repo: ogen-app/pdf-service
    railwayServiceId: "9de3575d-c5ec-4390-8abd-36935f0ac46f"
