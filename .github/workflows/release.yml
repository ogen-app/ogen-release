name: Release

# Keeps one "Release Ogen N" PR open with everything main holds since the last
# release (ogen-N). Every push to main rebuilds branch release/next from main:
# VERSION = N+1 and that release's notes in CHANGELOG.md. With nothing changed
# since ogen-N, the PR is closed. Merging it releases Ogen N+1 (publish, PR 2).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run at a time; a waiting run may be replaced by a newer push, which
# rebuilds the PR from the newer main anyway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr:
    name: Update the Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pushes and PRs must come from the release App, not GITHUB_TOKEN: a PR
      # opened or updated with GITHUB_TOKEN doesn't trigger the release gate.
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Full history and tags: the last release's release.yaml is read from its
      # tag. Credentials stay in the checkout for the push to release/next.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release
        run: go build -o "$RUNNER_TEMP/release" ./cmd/release

      - name: Commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Write the next release
        id: release
        run: |
          last=$(cat VERSION)
          previous=""
          if [ "$last" -gt 0 ]; then
            if ! git rev-parse --quiet --verify "refs/tags/ogen-$last" > /dev/null; then
              echo "::error::VERSION is $last, but tag ogen-$last doesn't exist. Publish tags each release."
              exit 1
            fi
            previous="$RUNNER_TEMP/previous.yaml"
            git show "ogen-$last:release.yaml" > "$previous"
          fi
          "$RUNNER_TEMP/release" pr -previous "$previous" -body "$RUNNER_TEMP/body.md" >> "$GITHUB_OUTPUT"

      - name: Open or update the Release PR
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git switch --quiet -C release/next
          git add VERSION CHANGELOG.md
          git commit --quiet --message "Release Ogen $VERSION"
          git push --quiet --force origin release/next

          title="Release Ogen $VERSION"
          pr=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated #$pr: $title"
          else
            gh pr create --base main --head release/next --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the Release PR
        if: steps.release.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "Nothing to release: release.yaml matches the last release."
          else
            echo "Nothing to release."
          fi
