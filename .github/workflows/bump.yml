name: Bump

# Service CI sends `bump {service, build, revision}` after it pushes
# ghcr.io/ogen-app/<service>:<build>. This pins the build in release.yaml and
# commits to main, which deploys development (deploy-development.yml).
on:
  repository_dispatch:
    types: [bump]

# One bump at a time. queue: max keeps every waiting run; by default a newer
# one would cancel the run already waiting and its bump would be lost.
concurrency:
  group: bump
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  bump:
    name: Bump ${{ github.event.client_payload.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The push must come from the release App, not GITHUB_TOKEN: a push made
      # with GITHUB_TOKEN doesn't trigger other workflows, so development would
      # never deploy. The main ruleset lets only this App push directly.
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build bump
        run: go build -o "$RUNNER_TEMP/bump" ./cmd/bump

      - name: Commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # The payload comes from outside this repo, so it reaches the shell only
      # through env and cmd/bump validates it. A push rejected because main
      # moved is retried from the new main, so cmd/bump re-checks the pinned
      # build every time.
      - name: Bump and push
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          BUILD: ${{ github.event.client_payload.build }}
          REVISION: ${{ github.event.client_payload.revision }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            msg=$("$RUNNER_TEMP/bump" -service "$SERVICE" -build "$BUILD" -revision "$REVISION")
            if [ -z "$msg" ]; then
              exit 0
            fi

            git commit --quiet --all --message "$msg"
            if git push --quiet origin HEAD:main; then
              git log -1 --format='Pushed %h: %s'
              exit 0
            fi

            echo "Push rejected (attempt $attempt); retrying from the new main."
            sleep $((attempt * 2 + RANDOM % 3))
          done
          echo "::error::Could not push the bump after 5 attempts."
          exit 1
